name: 构建 AMLL Player iOS 版本 (无签名)

on:
  push:
    branches:
      - build-ios-test
  workflow_dispatch:

permissions:
  contents: write

# 防止同一个分支有多个构建任务同时跑，浪费资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri-ios:
    name: 构建 iOS 产物
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        name: 克隆仓库
        with:
          fetch-depth: 0

      - name: 安装 PNPM
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: "aarch64-apple-ios, wasm32-unknown-unknown"

      - name: 下载并设置预编译的 FFmpeg 库 (iOS)
        shell: bash
        env:
          BUILDER_REPO: ITManCHINA/ffmpeg-builder
          FFMPEG_VERSION_TAG: "7.1"
        run: |
          PACKAGE_NAME="ffmpeg-${FFMPEG_VERSION_TAG}-ios-arm64.tar.gz"
          DOWNLOAD_URL="https://github.com/${BUILDER_REPO}/releases/latest/download/${PACKAGE_NAME}"
          EXTRACT_DIR="${{ github.workspace }}/vendor/ffmpeg_ios"

          echo "正在从 $DOWNLOAD_URL 下载 iOS FFmpeg..."
          curl -f -sL $DOWNLOAD_URL -o $PACKAGE_NAME

          mkdir -p $EXTRACT_DIR
          tar -xzf $PACKAGE_NAME -C $EXTRACT_DIR
          rm $PACKAGE_NAME

          # 设置环境变量，让 Rust 编译时能链接到这些库
          echo "FFMPEG_DIR=$EXTRACT_DIR" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$EXTRACT_DIR/lib/pkgconfig" >> $GITHUB_ENV
          
          # 告诉编译工具去哪里找 iOS 系统原生的 API
          SDK_PATH=$(xcrun --show-sdk-path --sdk iphoneos)
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $SDK_PATH" >> $GITHUB_ENV

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packages/player/src-tauri -> target
          key: ios-standalone-build

      - name: 安装 wasm-pack
        run: |
          # 使用官方脚本快速安装
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          # 确认安装路径已加入环境
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: 构建前端 React 代码
        run: |
          pnpm i --frozen-lockfile --ignore-scripts
          pnpm nx build player
        env:
          AMLL_GITHUB_IS_ACTION: true

      - name: 生成开发构建版本号
        run: |
          node ./packages/player/scripts/gen-dev-version.mjs

      - name: 初始化 Tauri iOS 原生项目
        run: |
          # 仅生成 src-tauri/gen/apple 下的 Xcode 项目文件
          pnpm -F player tauri ios init

      - name: 编译 Rust 静态库并构建 iOS 项目
        run: |
          cd packages/player
          
          # 1. 确保环境变量正确（如果是 Debug 构建）
          export TAURI_ENV_DEBUG=true
          
          # 2. 编译 Rust 库
          cargo build --target aarch64-apple-ios --manifest-path src-tauri/Cargo.toml
          
          # 3. 进入项目生成的 Apple 目录
          cd src-tauri/gen/apple
          
          # ---【核心修复：资源注入】---
          # 4. 创建 Xcode 资源存放目录（Tauri 默认会看这个位置）
          # 我们把 Vite 的 dist 内容直接软链接到这里，让 Xcode 以为它们是原生资源
          mkdir -p .tauri-resources
          cp -r ../../../dist/* .tauri-resources/
          
          # 5. 同时为了双重保险，把库重命名并放进 build 目录
          # 这里使用你之前定位成功的逻辑
          REAL_LIB=$(find ../../target/aarch64-apple-ios -name "libamll_player_lib.a" -type f | head -n 1)
          mkdir -p build/debug-iphoneos
          cp "$REAL_LIB" build/debug-iphoneos/libapp.a
          
          # 6. 移除干扰脚本
          sed -i '' '/tauri ios xcode-script/d' amll-player.xcodeproj/project.pbxproj
          
          # 7. 运行编译
          xcodebuild build \
            -project amll-player.xcodeproj \
            -scheme amll-player_iOS \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 手动封包为 .ipa 文件
        run: |
          # 1. 进入苹果项目目录
          cd packages/player/src-tauri/gen/apple
          
          # 2. 定位 .app 目录 (此时它已经由 xcodebuild 生成，但缺前端资源)
          APP_DIR=$(find build/debug-iphoneos -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
            echo "❌ 错误：没找到 .app 目录，请检查上一步 xcodebuild 是否成功"
            exit 1
          fi

          # 3. 【核心修复】将 Vite 产出的前端资源拷贝进 .app 包
          # 注意：Vite 产物在 packages/player/dist，
          # 我们现在的路径是 packages/player/src-tauri/gen/apple，所以是 ../../../dist
          echo "🚀 正在将前端资源注入 .app 包..."
          cp -r ../../../dist/* "$APP_DIR/"

          # 4. 验证 index.html 是否到位
          if [ -f "$APP_DIR/index.html" ]; then
            echo "✅ index.html 注入成功！"
          else
            echo "❌ 错误：index.html 注入失败，请检查路径。"
            ls -R ../../../dist
            exit 1
          fi
          
          # 5. 开始封包
          echo "📦 正在打包为 .ipa..."
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r AMLL-Player-iOS-Unsigned.ipa Payload
          
          echo "IPA 文件生成成功。"

      - name: 上传 IPA 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AMLL-Player-iOS-Unsigned-IPA
          path: packages/player/src-tauri/gen/apple/AMLL-Player-iOS-Unsigned.ipa
