name: 构建 AMLL Player iOS 版本 (无签名)

on:
  push:
    branches:
      - build-ios-test
  workflow_dispatch:

permissions:
  contents: write

# 防止同一个分支有多个构建任务同时跑，浪费资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri-ios:
    name: 构建 iOS 产物
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        name: 克隆仓库
        with:
          fetch-depth: 0

      - name: 安装 PNPM
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: "aarch64-apple-ios, wasm32-unknown-unknown"

      - name: 下载并设置预编译的 FFmpeg 库 (iOS)
        shell: bash
        env:
          BUILDER_REPO: ITManCHINA/ffmpeg-builder
          FFMPEG_VERSION_TAG: "7.1"
        run: |
          PACKAGE_NAME="ffmpeg-${FFMPEG_VERSION_TAG}-ios-arm64.tar.gz"
          DOWNLOAD_URL="https://github.com/${BUILDER_REPO}/releases/latest/download/${PACKAGE_NAME}"
          EXTRACT_DIR="${{ github.workspace }}/vendor/ffmpeg_ios"

          echo "正在从 $DOWNLOAD_URL 下载 iOS FFmpeg..."
          curl -f -sL $DOWNLOAD_URL -o $PACKAGE_NAME

          mkdir -p $EXTRACT_DIR
          tar -xzf $PACKAGE_NAME -C $EXTRACT_DIR
          rm $PACKAGE_NAME

          # 设置环境变量，让 Rust 编译时能链接到这些库
          echo "FFMPEG_DIR=$EXTRACT_DIR" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$EXTRACT_DIR/lib/pkgconfig" >> $GITHUB_ENV
          
          # 告诉编译工具去哪里找 iOS 系统原生的 API
          SDK_PATH=$(xcrun --show-sdk-path --sdk iphoneos)
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $SDK_PATH" >> $GITHUB_ENV

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packages/player/src-tauri -> target
          key: ios-standalone-build

      - name: 安装 wasm-pack
        run: |
          # 使用官方脚本快速安装
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          # 确认安装路径已加入环境
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: 构建前端 React 代码
        run: |
          pnpm i --frozen-lockfile --ignore-scripts
          pnpm nx build player
        env:
          AMLL_GITHUB_IS_ACTION: true

      - name: 生成开发构建版本号
        run: |
          node ./packages/player/scripts/gen-dev-version.mjs

      - name: 初始化 Tauri iOS 原生项目
        run: |
          # 仅生成 src-tauri/gen/apple 下的 Xcode 项目文件
          pnpm -F player tauri ios init

      - name: 编译 Rust 静态库并构建 iOS 项目
        run: |
          cd packages/player
          
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export CFLAGS="-isysroot $SDKROOT"
          
          # 1. 使用 Tauri 官方推荐的构建方式（会自动处理环境变量）
          # 我们先尝试不加 --no-bundle，如果报错则改用 cargo build
          pnpm tauri ios build --debug || \
          cargo build --target aarch64-apple-ios --manifest-path src-tauri/Cargo.toml

          # 2. 进入苹果项目目录
          cd src-tauri/gen/apple
          
          # 3. 【优化核心】智能寻找并搬运 libapp.a
          # 无论是在 target/aarch64-apple-ios/debug 还是 release，直接通通搜出来
          echo "正在定位 Rust 静态库..."
          LIB_PATH=$(find ../../target/aarch64-apple-ios -name "libapp.a" -type f | head -n 1)
          
          if [ -z "$LIB_PATH" ]; then
            echo "❌ 错误：在 target 目录下未找到 libapp.a"
            find ../../target -name "*.a" # 打印所有静态库方便调试
            exit 1
          fi
          
          echo "✅ 找到静态库: $LIB_PATH"
          
          # 创建 Xcode 预期的构建目录并拷贝
          mkdir -p build/debug-iphoneos
          cp "$LIB_PATH" build/debug-iphoneos/libapp.a
          
          # 4. 【黑科技】移除报错脚本，防止 Xcode 乱跑
          sed -i '' '/tauri ios xcode-script/d' amll-player.xcodeproj/project.pbxproj
          
          # 5. 执行最终链接编译
          xcodebuild build \
            -project amll-player.xcodeproj \
            -scheme amll-player_iOS \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 手动封包为 .ipa 文件
        run: |
          cd packages/player/src-tauri/gen/apple
          
          APP_PATH=$(find build/Release-iphoneos -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ 错误：在 build 目录中没找到编译好的 .app 文件"
            ls -R build
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          zip -r AMLL-Player-iOS-Unsigned.ipa Payload
          
          echo "IPA 文件生成成功。"

      - name: 上传 IPA 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AMLL-Player-iOS-Unsigned-IPA
          path: packages/player/src-tauri/gen/apple/AMLL-Player-iOS-Unsigned.ipa
